name: Forge CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and static validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install '.[validation]'
      - run: bash scripts/validate.sh
        env:
          FORGE_WITH_COVERAGE: "1"
      - name: Enforce changed Forge source coverage
        if: github.event_name == 'pull_request'
        env:
          FORGE_COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_changed_product_coverage.py forge-coverage.json
      - name: Forge inner-loop integration (mock EP)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/forge-wheel"
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/forge-wheel"
          wheel=("$RUNNER_TEMP"/forge-wheel/forge_autonomy-*.whl)
          test "${#wheel[@]}" -eq 1
          python -m venv "$RUNNER_TEMP/forge-installed"
          "$RUNNER_TEMP/forge-installed/bin/pip" install --no-deps "${wheel[0]}"
          "$RUNNER_TEMP/forge-installed/bin/pip" install 'jsonschema==4.26.0'
          cd "$RUNNER_TEMP"
          set +e
          "$RUNNER_TEMP/forge-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/qualification/qualify_installed_http_successor.py" \
            --wheel "${wheel[0]}" --source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/forge-http-successor"
          qualification_exit=$?
          set -e
          if test "$qualification_exit" -ne 0; then exit "$qualification_exit"; fi
          "$RUNNER_TEMP/forge-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/qualification/qualify_installed_fci_failure_gate.py" \
            --wheel "${wheel[0]}" --source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/forge-fci-failure-gate"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: forge-installed-http-successor-${{ github.sha }}
          path: |
            ${{ runner.temp }}/forge-http-successor/installed-http-successor.public.json
            ${{ runner.temp }}/forge-fci-failure-gate/installed-fci-failure-gate.public.json
          if-no-files-found: ignore
      - name: Approved worklist read producer (isolated)
        timeout-minutes: 3
        run: |
          set -euo pipefail
          wheel=("$RUNNER_TEMP"/forge-wheel/forge_autonomy-*.whl)
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/forge-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/qualification/qualify_installed_worklist_read.py" \
            --wheel "${wheel[0]}" --source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/forge-worklist-read"
          set +e
          "$RUNNER_TEMP/forge-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/qualification/qualify_installed_worklist_read.py" \
            --wheel "${wheel[0]}" --source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/forge-worklist-read-failure" --failure-control
          failure_exit=$?
          set -e
          test "$failure_exit" -eq 1
          "$RUNNER_TEMP/forge-installed/bin/python" -I -c 'import json,pathlib; d=json.loads(pathlib.Path("forge-worklist-read-failure/installed-worklist-read.public.json").read_text()); assert d["result"] == "FAIL" and d["failure_type"] == "AssertionError" and d["failure_stage"] == "positive-read" and d["observed_read_status"] == 401 and d["external_fault"] == "revoked-positive-read-credential"'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: forge-installed-worklist-read-${{ github.sha }}
          path: |
            ${{ runner.temp }}/forge-worklist-read/installed-worklist-read.public.json
            ${{ runner.temp }}/forge-worklist-read-failure/installed-worklist-read.public.json
          if-no-files-found: ignore
      - name: Serial approved worklist (isolated installed processes)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          wheel=("$RUNNER_TEMP"/forge-wheel/forge_autonomy-*.whl)
          test "${#wheel[@]}" -eq 1
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/forge-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/qualification/qualify_installed_worklist_activation.py" \
            --wheel "${wheel[0]}" --source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/forge-worklist-activation"
          "$RUNNER_TEMP/forge-installed/bin/python" -I -c 'import json,pathlib; d=json.loads(pathlib.Path("forge-worklist-activation/installed-worklist-activation.public.json").read_text()); assert d["result"] == "SERIAL_APPROVED_WORKLIST_PASS" and d["case_count"] == d["expected_case_count"] == 24 and all(c["owned_runtime_target_home_config_scratch_removed"] for c in d["cleanup"])'
          set +e
          "$RUNNER_TEMP/forge-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/qualification/qualify_installed_worklist_activation.py" \
            --wheel "${wheel[0]}" --source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/forge-worklist-activation-failure" --failure-control
          failure_exit=$?
          set -e
          test "$failure_exit" -eq 1
          "$RUNNER_TEMP/forge-installed/bin/python" -I -c 'import json,pathlib; d=json.loads(pathlib.Path("forge-worklist-activation-failure/installed-worklist-activation.public.json").read_text()); assert d["result"] == "FAIL" and d["failure_type"] == "AssertionError" and d["failure_stage"] == "B-activation" and d["observed_allocations"] == d["observed_provider_invocations"] == 1 and d["external_fault"] == "RELEASE_REVOKED_BEFORE_B" and all(c["owned_runtime_target_home_config_scratch_removed"] for c in d["cleanup"])'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: forge-installed-worklist-activation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/forge-worklist-activation/installed-worklist-activation.public.json
            ${{ runner.temp }}/forge-worklist-activation-failure/installed-worklist-activation.public.json
          if-no-files-found: ignore
      - name: Scoped worklist hold producer (isolated installed HTTP)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          wheel=("$RUNNER_TEMP"/forge-wheel/forge_autonomy-*.whl)
          test "${#wheel[@]}" -eq 1
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/forge-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/qualification/qualify_installed_worklist_control.py" \
            --wheel "${wheel[0]}" --source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/forge-worklist-control"
          "$RUNNER_TEMP/forge-installed/bin/python" -I -c 'import json,pathlib; d=json.loads(pathlib.Path("forge-worklist-control/installed-worklist-control.public.json").read_text()); assert d["result"] == "WORKLIST_CONTROL_PASS" and d["case_count"] == 43 and all(c["owned_runtime_home_credentials_scratch_removed"] for c in d["cleanup"])'
          set +e
          "$RUNNER_TEMP/forge-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/qualification/qualify_installed_worklist_control.py" \
            --wheel "${wheel[0]}" --source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/forge-worklist-control-failure" --failure-control
          failure_exit=$?
          set -e
          test "$failure_exit" -eq 1
          "$RUNNER_TEMP/forge-installed/bin/python" -I -c 'import json,pathlib; d=json.loads(pathlib.Path("forge-worklist-control-failure/installed-worklist-control.public.json").read_text()); assert d["result"] == "FAIL" and d["failure"]["type"] == "AssertionError" and d["failure"]["stage"] == "positive-command-replay" and d["external_fault"] == "REVOKED_CONTROL_GRANT" and all(c["owned_runtime_home_credentials_scratch_removed"] for c in d["cleanup"])'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: forge-installed-worklist-control-${{ github.sha }}
          path: |
            ${{ runner.temp }}/forge-worklist-control/installed-worklist-control.public.json
            ${{ runner.temp }}/forge-worklist-control-failure/installed-worklist-control.public.json
          if-no-files-found: ignore
      - name: Advisory HTTP producer (isolated installed service)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          wheel=("$RUNNER_TEMP"/forge-wheel/forge_autonomy-*.whl)
          test "${#wheel[@]}" -eq 1
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/forge-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/qualification/qualify_installed_advisory.py" \
            --wheel "${wheel[0]}" --source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/forge-advisory-http"
          python -c 'import json,os; from pathlib import Path; d=json.loads((Path(os.environ["RUNNER_TEMP"])/"forge-advisory-http/installed-advisory.public.json").read_text()); assert d["result"]=="ADVISORY_HTTP_PASS" and d["case_count"]==11 and d["cleanup"]["owned_runtime_home_credentials_scratch_removed"]'
          set +e
          "$RUNNER_TEMP/forge-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/qualification/qualify_installed_advisory.py" \
            --wheel "${wheel[0]}" --source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/forge-advisory-http-control" --failure-control
          gate_exit=$?
          set -e
          test "$gate_exit" -eq 1
          python -c 'import json,os; from pathlib import Path; d=json.loads((Path(os.environ["RUNNER_TEMP"])/"forge-advisory-http-control/installed-advisory.public.json").read_text()); assert d["result"]=="FAIL" and d["failure"]["type"]=="AssertionError" and d["failure"]["stage"]=="positive-replay" and d["external_fault"]=="REVOKED_POSITIVE_ADVISORY_GRANT"'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: forge-installed-advisory-${{ github.sha }}
          path: |
            ${{ runner.temp }}/forge-advisory-http/installed-advisory.public.json
            ${{ runner.temp }}/forge-advisory-http-control/installed-advisory.public.json
          if-no-files-found: ignore
      - name: Advisory Candidate producer (isolated installed canonical lifecycle)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          wheel=("$RUNNER_TEMP"/forge-wheel/forge_autonomy-*.whl)
          test "${#wheel[@]}" -eq 1
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/forge-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/qualification/qualify_installed_advisory_candidate.py" \
            --wheel "${wheel[0]}" --source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/forge-advisory-candidate"
          python -c 'import json,os; from pathlib import Path; d=json.loads((Path(os.environ["RUNNER_TEMP"])/"forge-advisory-candidate/installed-advisory-candidate.public.json").read_text()); assert d["result"]=="ADVISORY_CANDIDATE_PASS" and d["case_count"]==11 and d["cleanup"]["owned_runtime_home_credentials_scratch_removed"]'
          set +e
          "$RUNNER_TEMP/forge-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/qualification/qualify_installed_advisory_candidate.py" \
            --wheel "${wheel[0]}" --source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/forge-advisory-candidate-control" --failure-control
          gate_exit=$?
          set -e
          test "$gate_exit" -eq 1
          python -c 'import json,os; from pathlib import Path; d=json.loads((Path(os.environ["RUNNER_TEMP"])/"forge-advisory-candidate-control/installed-advisory-candidate.public.json").read_text()); assert d["result"]=="FAIL" and d["failure"]["type"]=="AssertionError" and d["failure"]["stage"]=="positive-candidate-replay" and d["external_fault"]=="REVOKED_POSITIVE_CANDIDATE_GRANT" and d["cleanup"]["owned_runtime_home_credentials_scratch_removed"]'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: forge-installed-advisory-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/forge-advisory-candidate/installed-advisory-candidate.public.json
            ${{ runner.temp }}/forge-advisory-candidate-control/installed-advisory-candidate.public.json
          if-no-files-found: ignore
      - name: Chat-first Mission producer (isolated installed canonical ready route)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          wheel=("$RUNNER_TEMP"/forge-wheel/forge_autonomy-*.whl)
          test "${#wheel[@]}" -eq 1
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/forge-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/qualification/qualify_installed_mission_concepts.py" \
            --wheel "${wheel[0]}" --source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/forge-mission-concepts"
          python -c 'import json,os; from pathlib import Path; d=json.loads((Path(os.environ["RUNNER_TEMP"])/"forge-mission-concepts/installed-mission-concepts.public.json").read_text()); assert d["result"]=="CHAT_FIRST_MISSION_PRODUCER_PASS" and d["case_count"]>=20 and d["cleanup"]["owned_runtime_home_credentials_scratch_removed"]'
          set +e
          "$RUNNER_TEMP/forge-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/qualification/qualify_installed_mission_concepts.py" \
            --wheel "${wheel[0]}" --source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/forge-mission-concepts-control" --failure-control
          gate_exit=$?
          set -e
          test "$gate_exit" -eq 1
          python -c 'import json,os; from pathlib import Path; d=json.loads((Path(os.environ["RUNNER_TEMP"])/"forge-mission-concepts-control/installed-mission-concepts.public.json").read_text()); assert d["result"]=="FAIL" and d["failure"]["stage"]=="positive-concept-replay" and d["external_fault"]=="REVOKED_POSITIVE_CONCEPT_GRANT" and d["cleanup"]["owned_runtime_home_credentials_scratch_removed"]'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: forge-mission-concepts-${{ github.sha }}
          path: |
            ${{ runner.temp }}/forge-mission-concepts/installed-mission-concepts.public.json
            ${{ runner.temp }}/forge-mission-concepts-control/installed-mission-concepts.public.json
          if-no-files-found: ignore
      - name: Own-installation detach (exact installed CLI HTTP receipts)
        timeout-minutes: 4
        run: |
          set -euo pipefail
          wheel=("$RUNNER_TEMP"/forge-wheel/forge_autonomy-*.whl)
          test "${#wheel[@]}" -eq 1
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/forge-installed/bin/python" -I "$GITHUB_WORKSPACE/scripts/qualification/qualify_installed_installation_detach.py" --wheel "${wheel[0]}" --source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" --output-dir "$RUNNER_TEMP/forge-installation-detach"
          set +e
          "$RUNNER_TEMP/forge-installed/bin/python" -I "$GITHUB_WORKSPACE/scripts/qualification/qualify_installed_installation_detach.py" --wheel "${wheel[0]}" --source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" --output-dir "$RUNNER_TEMP/forge-installation-detach-control" --failure-control
          gate_exit=$?
          set -e
          test "$gate_exit" -eq 1
          python -c 'import json,os; from pathlib import Path; d=json.loads((Path(os.environ["RUNNER_TEMP"])/"forge-installation-detach-control/installed-installation-detach.public.json").read_text()); assert d["result"]=="FAIL" and d["failure_control_detected"] and d["failure"]=={"type":"AssertionError","stage":"positive-installation-detach"} and d["external_fault"]=="REVOKED_POSITIVE_INSTALLATION_OPERATOR" and d["cleanup"]["owned_runtime_home_credentials_scratch_removed"]'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: forge-installation-detach-${{ github.sha }}
          path: |
            ${{ runner.temp }}/forge-installation-detach/installed-installation-detach.public.json
            ${{ runner.temp }}/forge-installation-detach-control/installed-installation-detach.public.json
          if-no-files-found: ignore
      - name: Approved workset release (isolated installed HTTP CLI runtime simulator)
        timeout-minutes: 12
        run: |
          set -euo pipefail
          wheel=("$RUNNER_TEMP"/forge-wheel/forge_autonomy-*.whl)
          test "${#wheel[@]}" -eq 1
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/forge-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/qualification/qualify_installed_workset_release.py" \
            --wheel "${wheel[0]}" --source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/forge-workset-release"
          python -c 'import json,os; from pathlib import Path; d=json.loads((Path(os.environ["RUNNER_TEMP"])/"forge-workset-release/installed-workset-release.public.json").read_text()); assert d["result"]=="APPROVED_WORKSET_RELEASE_PASS" and d["case_count"]>=27 and d["cleanup"]["owned_runtime_home_credentials_scratch_removed"]'
          set +e
          "$RUNNER_TEMP/forge-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/qualification/qualify_installed_workset_release.py" \
            --wheel "${wheel[0]}" --source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/forge-workset-release-control" --failure-control
          gate_exit=$?
          set -e
          test "$gate_exit" -eq 1
          python -c 'import json,os; from pathlib import Path; d=json.loads((Path(os.environ["RUNNER_TEMP"])/"forge-workset-release-control/installed-workset-release.public.json").read_text()); assert d["result"]=="FAIL" and d["failure"]["type"]=="AssertionError" and d["failure_control_detected"] and d["failure"]["stage"]=="positive-workset-activation" and d["external_fault"]=="REVOKED_POSITIVE_RELEASE_GRANT" and d["cleanup"]["owned_runtime_home_credentials_scratch_removed"]'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: forge-workset-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/forge-workset-release/installed-workset-release.public.json
            ${{ runner.temp }}/forge-workset-release-control/installed-workset-release.public.json
          if-no-files-found: ignore
      - name: Candidate decisions producer (isolated installed canonical approvals)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          wheel=("$RUNNER_TEMP"/forge-wheel/forge_autonomy-*.whl)
          test "${#wheel[@]}" -eq 1
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/forge-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/qualification/qualify_installed_candidate_decisions.py" \
            --wheel "${wheel[0]}" --source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/forge-candidate-decisions"
          python -c 'import json,os; from pathlib import Path; d=json.loads((Path(os.environ["RUNNER_TEMP"])/"forge-candidate-decisions/installed-candidate-decisions.public.json").read_text()); assert d["result"]=="CANDIDATE_DECISIONS_PASS" and d["case_count"]==11 and d["cleanup"]["owned_runtime_home_credentials_scratch_removed"]'
          set +e
          "$RUNNER_TEMP/forge-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/qualification/qualify_installed_candidate_decisions.py" \
            --wheel "${wheel[0]}" --source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/forge-candidate-decisions-control" --failure-control
          gate_exit=$?
          set -e
          test "$gate_exit" -eq 1
          python -c 'import json,os; from pathlib import Path; d=json.loads((Path(os.environ["RUNNER_TEMP"])/"forge-candidate-decisions-control/installed-candidate-decisions.public.json").read_text()); assert d["result"]=="FAIL" and d["failure"]["type"]=="AssertionError" and d["failure"]["stage"]=="positive-decision-replay" and d["external_fault"]=="REVOKED_POSITIVE_DECISION_GRANT" and d["cleanup"]["owned_runtime_home_credentials_scratch_removed"]'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: forge-installed-candidate-decisions-${{ github.sha }}
          path: |
            ${{ runner.temp }}/forge-candidate-decisions/installed-candidate-decisions.public.json
            ${{ runner.temp }}/forge-candidate-decisions-control/installed-candidate-decisions.public.json
          if-no-files-found: ignore
      - name: Qualify installed Action authority boundary
        run: |
          set -euo pipefail
          wheel=("$RUNNER_TEMP"/forge-wheel/forge_autonomy-*.whl)
          test "${#wheel[@]}" -eq 1
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/forge-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/qualification/qualify_installed_action_authority.py" \
            --wheel "${wheel[0]}" --source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --output "$GITHUB_WORKSPACE/installed-action-authority-boundary.public.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: forge-installed-action-authority-boundary-${{ github.sha }}
          path: installed-action-authority-boundary.public.json
          if-no-files-found: ignore
      - name: Exact published 2.7.39 to 2.8.1 preservation maintenance
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python -I "$GITHUB_WORKSPACE/scripts/qualification/qualify_published_preservation_2739_281.py" \
            --inputs "$RUNNER_TEMP/forge-published-preservation-inputs" --fetch-inputs \
            --source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/forge-published-preservation"
