name: Forge CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and static validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install '.[validation]'
      - run: bash scripts/validate.sh
        env:
          FORGE_WITH_COVERAGE: "1"
      - name: Enforce changed Forge source coverage
        if: github.event_name == 'pull_request'
        env:
          FORGE_COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_changed_product_coverage.py forge-coverage.json
      - name: Qualify installed HTTP evidence-driven successor
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/forge-wheel"
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/forge-wheel"
          wheel=("$RUNNER_TEMP"/forge-wheel/forge_autonomy-*.whl)
          test "${#wheel[@]}" -eq 1
          python -m venv "$RUNNER_TEMP/forge-installed"
          "$RUNNER_TEMP/forge-installed/bin/pip" install --no-deps "${wheel[0]}"
          cd "$RUNNER_TEMP"
          set +e
          "$RUNNER_TEMP/forge-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/qualification/qualify_installed_http_successor.py" \
            --wheel "${wheel[0]}" --source-revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/forge-http-successor"
          qualification_exit=$?
          set -e
          if test -f "$RUNNER_TEMP/forge-http-successor/installed-http-successor.public.json"; then
            cp "$RUNNER_TEMP/forge-http-successor/installed-http-successor.public.json" \
              "$GITHUB_WORKSPACE/installed-http-successor.public.json"
          fi
          exit "$qualification_exit"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: forge-installed-http-successor-${{ github.sha }}
          path: installed-http-successor.public.json
          if-no-files-found: ignore
