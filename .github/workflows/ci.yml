          python -c 'import json,os; from pathlib import Path; d=json.loads((Path(os.environ["RUNNER_TEMP"])/"forge-maintenance-coverage.json").read_text()); rows=[v for k,v in d["files"].items() if k.endswith("scripts/update_installed_forge.py")]; assert len(rows)==1 and rows[0]["summary"]["percent_covered"]>80.2'
